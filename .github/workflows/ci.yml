name: Synthetic checks
on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx --no-install playwright install chromium
      - run: node tests/browser-depth.mjs
      - run: node tests/browser-offline.mjs
      - run: node tests/browser-ui.mjs
      - name: Install macOS WebKit
        if: runner.os == 'macOS'
        run: npx --no-install playwright install webkit
      - name: Offline file archive in macOS WebKit
        if: runner.os == 'macOS'
        env:
          CGE_BROWSER_ENGINE: webkit
        run: node tests/browser-offline.mjs
      - name: Local UI in macOS WebKit
        if: runner.os == 'macOS'
        env:
          CGE_BROWSER_ENGINE: webkit
        run: node tests/browser-ui.mjs
